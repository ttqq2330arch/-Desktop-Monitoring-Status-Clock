; 桌面电脑状态监控 · ESP32-WROOM-32 DevKit V1 (CH340C) + ST7735S 128x160 横屏
[env:esp32dev]
; 锁死版本，避免每次都联网查 registry 卡住（本机已装 6.12.0）
platform = espressif32@6.12.0
board = esp32dev
framework = arduino

; 串口用于接收 PC 数据，不要同时开 monitor（会抢 COM 口）
monitor_speed = 115200
upload_speed = 921600

; 依赖由 PlatformIO 自动下载（仓库不收录第三方库源码，见 THIRD_PARTY.md）
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Os

; 工程路径含中文时，xtensa 的 ld 建不了非 ASCII 路径的 map 文件，链接会失败。
; no_map.py 负责摘掉 -Wl,-Map；把工程搬到纯 ASCII 路径后可删除这一行。
extra_scripts = no_map.py

; 如果 921600 烧录失败，改成 upload_speed = 460800

; 屏幕几何自检：画贴边框 + 16px 网格 + 中央十字 + 正圆 + 四角编号
; 用来区分「屏幕模块物理插歪」和「驱动配置导致画面倾斜/错位」
; 烧录：pio run -e esp32dev_selftest -t upload --upload-port COM6
; 看完后烧回正常固件：pio run -e esp32dev -t upload --upload-port COM6
[env:esp32dev_selftest]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSELFTEST
